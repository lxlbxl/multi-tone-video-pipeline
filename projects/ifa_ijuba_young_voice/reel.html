<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let E = null, LOGO = null, FRAME = null, SRC = 179.45, TOT = 183.25, LINES = [], ASE = [];
const C = { green: '#0f5a24', deep: '#062d18', leaf: '#3f8a2a', lime: '#9cbc2a', yellow: '#f2c230', gold: '#c9a24a', goldD: '#a07a26', goldL: '#e6cf8f', coral: '#e2683a' };
const SANS = '"Inter Display", Inter, "Noto Color Emoji", sans-serif';
const CARD = { x: 20, y: 276, w: 1040, h: 1210 };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x - 1, 3) + c1*Math.pow(x - 1, 2); };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function secIdx(t) { let k = 0; for (let i = 0; i < E.sections.length; i++) if (t >= E.sections[i].start - .1) k = i; return k; }
function lineIdx(t) { for (let i = LINES.length - 1; i >= 0; i--) if (t >= LINES[i][0] - .06) return i; return -1; }

// ---------- base: pre-composited, upscaled frame; gentle push on section changes ----------
function base(t) {
  if (!FRAME) return;
  let z = 1;
  if (t < SRC) { const s = E.sections[secIdx(t)], lt = t - s.start; z = 1 + .035 * (1 - easeOut(lt / .7)) * (lt >= 0 ? 1 : 0); }
  ctx.save(); ctx.translate(540, 880); ctx.scale(z, z); ctx.translate(-540, -880);
  if (t >= SRC) ctx.filter = `blur(${clamp((t - SRC) / .6) * 16}px)`;
  ctx.drawImage(FRAME, 0, 0, W, H); ctx.restore();
}

// ---------- icons ----------
function icon(name, s, col) {
  ctx.save(); ctx.scale(s, s); ctx.lineWidth = 3.4; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch (name) {
    case 'sun': ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill(); for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a)*17, Math.sin(a)*17); ctx.lineTo(Math.cos(a)*27, Math.sin(a)*27); ctx.stroke(); } break;
    case 'earth': ctx.beginPath(); ctx.moveTo(-28, 18); ctx.quadraticCurveTo(-12, -22, 4, 6); ctx.quadraticCurveTo(14, -12, 28, 18); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(-30, 22); ctx.lineTo(30, 22); ctx.stroke(); break;
    case 'tree': ctx.fillRect(-3, -2, 6, 28); ctx.beginPath(); ctx.arc(0, -10, 16, 0, 7); ctx.arc(-13, -2, 10, 0, 7); ctx.arc(13, -2, 10, 0, 7); ctx.fill(); break;
    case 'opon': ctx.beginPath(); ctx.arc(0, 0, 25, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.stroke();
      ctx.lineWidth = 3; for (let r = 0; r < 3; r++) { ctx.beginPath(); ctx.moveTo(-6, -9 + r*9); ctx.lineTo(-6, -4 + r*9); ctx.moveTo(4, -9 + r*9); ctx.lineTo(4, -4 + r*9); ctx.moveTo(8, -9 + r*9); ctx.lineTo(8, -4 + r*9); ctx.stroke(); } break;
    case 'ogun': ctx.beginPath(); ctx.moveTo(-20, 22); ctx.lineTo(12, -16); ctx.quadraticCurveTo(26, -30, 22, -10); ctx.lineTo(-12, 28); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(-20, 22); ctx.lineTo(-28, 30); ctx.stroke(); break;
    case 'bird': ctx.beginPath(); ctx.ellipse(-2, 6, 22, 14, -.2, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(18, -8, 9, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(26, -8); ctx.lineTo(36, -4); ctx.lineTo(26, -2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-6, 0); ctx.quadraticCurveTo(-20, -30, -34, -26); ctx.quadraticCurveTo(-22, -6, -8, 10); ctx.fill(); break;
    case 'gourd': ctx.beginPath(); ctx.arc(0, 8, 18, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(0, -14, 9, 0, 7); ctx.fill(); ctx.fillRect(-2, -28, 4, 8); break;
    case 'snail': ctx.beginPath(); for (let a = 0; a < 12; a += .1) { const r = 2 + a * 1.9; const x = Math.cos(a) * r, y = Math.sin(a) * r * .8; a ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); break;
    case 'fan': ctx.beginPath(); ctx.arc(0, -6, 20, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -6, 10, 0, 7); ctx.stroke();
      for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a)*20, -6 + Math.sin(a)*20); ctx.lineTo(Math.cos(a)*26, -6 + Math.sin(a)*26); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, 30); ctx.stroke(); break;
    case 'axe': ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(0, -6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -6); ctx.quadraticCurveTo(-26, -10, -22, -30); ctx.quadraticCurveTo(-8, -18, 0, -24); ctx.quadraticCurveTo(8, -18, 22, -30); ctx.quadraticCurveTo(26, -10, 0, -6); ctx.fill(); break;
  }
  ctx.restore();
}

// ---------- header with section tracker + logo ----------
function header(t) {
  const a = t < SRC ? easeOut(t / .5) : clamp(1 - (t - SRC) / .4);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const x = 20, y = 70, w = 780, h = 186;
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  rr(x, y, w, h, 34); ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = C.yellow; rr(x + 26, y + 30, 10, h - 60, 5); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `800 25px ${SANS}`; ctx.fillStyle = C.goldD; ctx.fillText('✦  ÌJÚBÀ · SACRED HOMAGE CHANT', x + 58, y + 50);
  ctx.font = `900 56px ${SANS}`; ctx.fillStyle = C.green; ctx.fillText('Ìbà o! A young voice 🙏🏾', x + 56, y + 110);
  // section tracker: 10 beads, current one glows
  const k = t < SRC ? secIdx(t) : 9;
  for (let i = 0; i < 10; i++) {
    const bx = x + 70 + i * 40, by = y + 150, cur = i === k, done = i < k;
    ctx.beginPath(); ctx.arc(bx, by, cur ? 12 : 9, 0, 7);
    ctx.fillStyle = cur ? C.yellow : done ? C.leaf : '#e2e6dc'; ctx.fill();
    if (cur) { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(242,194,48,.45)'; ctx.beginPath(); ctx.arc(bx, by, 18 + 3 * Math.sin(t * 5), 0, 7); ctx.stroke(); }
  }
  ctx.font = `600 26px ${SANS}`; ctx.fillStyle = '#6a7560';
  ctx.fillText(`${Math.min(10, k + 1)} / 10  ·  ${E.sections[k].name}`, x + 480, y + 159);
  ctx.restore();
  if (LOGO) {
    const lw = 160, lh = lw * LOGO.height / LOGO.width, cx = 935, cy = 163;
    ctx.save(); ctx.globalAlpha = a;
    ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
    ctx.beginPath(); ctx.arc(cx, cy, 98, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.drawImage(LOGO, cx - lw / 2, cy - lh / 2, lw, lh); ctx.restore();
  }
}

// ---------- deity title card at each section ----------
function deityCard(t) {
  if (t >= SRC + .3 || t < E.sections[0].start) return;
  const k = secIdx(t), s = E.sections[k], lt = t - s.start;
  const out = t < SRC ? 1 : clamp(1 - (t - SRC) / .3);
  // big intro for the first 2.2s, then settles to a compact chip top-left of the video
  const settle = easeOut((lt - 2.0) / .5);
  const inn = back(lt / .5);
  ctx.save(); ctx.globalAlpha = out * clamp(lt / .2 + .001);
  const bigX = 540, bigY = 640, smallX = 60, smallY = 316;
  ctx.font = `900 64px ${SANS}`; const nw = ctx.measureText(s.name).width;
  ctx.font = `600 28px ${SANS}`; const sw = ctx.measureText(s.sub).width;
  const cw = Math.max(nw, sw) + 170, ch = 130;
  const sc = (1 - settle) * 1.0 + settle * .72;
  const cx = (1 - settle) * (bigX - cw / 2) + settle * smallX, cy = (1 - settle) * (bigY - ch / 2) + settle * smallY;
  ctx.translate(cx, cy); ctx.scale(sc * inn, sc * inn);
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(0, 0, cw, ch, 65); ctx.fillStyle = 'rgba(255,255,255,.97)'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3; ctx.strokeStyle = C.goldL; ctx.stroke();
  ctx.beginPath(); ctx.arc(65, 65, 46, 0, 7); ctx.fillStyle = C.green; ctx.fill();
  ctx.save(); ctx.translate(65, 65); icon(s.icon, 1.1, C.yellow); ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `700 22px ${SANS}`; ctx.fillStyle = C.goldD; ctx.fillText('ÌBÀ FÚN', 132, 36);
  ctx.font = `900 54px ${SANS}`; ctx.fillStyle = C.green; ctx.fillText(s.name, 130, 86);
  ctx.font = `600 26px ${SANS}`; ctx.fillStyle = '#6a7560'; ctx.fillText(s.sub, 132, 116);
  ctx.restore();
}

// ---------- karaoke captions on a plate across the bottom of the video ----------
const PL = { x: 40, y: 1292, w: 1000, h: 176 };
function wrap(words, maxW) {
  const rows = [[]]; let w = 0; const sp = ctx.measureText(' ').width;
  for (const wd of words) { const ww = ctx.measureText(wd).width; if (w + ww > maxW && rows[rows.length - 1].length) { rows.push([]); w = 0; } rows[rows.length - 1].push(wd); w += ww + sp; }
  return rows;
}
function captions(t) {
  const a = t < SRC ? easeOut((t - .5) / .4) : clamp(1 - (t - SRC) / .35);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, PL.y, 0, PL.y + PL.h); g.addColorStop(0, 'rgba(6,45,24,.90)'); g.addColorStop(1, 'rgba(4,32,17,.94)');
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 8;
  rr(PL.x, PL.y, PL.w, PL.h, 32); ctx.fillStyle = g; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(230,207,143,.55)'; ctx.stroke();
  // bead trim + progress
  let i = 0; for (let x = PL.x + 50; x <= PL.x + PL.w - 50; x += 16, i++) { ctx.beginPath(); ctx.arc(x, PL.y, 6, 0, 7); ctx.fillStyle = (Math.floor(i / 3) % 2) ? C.yellow : C.leaf; ctx.fill(); }
  const p = clamp(t / SRC); rr(PL.x + 36, PL.y + PL.h - 22, PL.w - 72, 7, 3.5); ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
  const pg = ctx.createLinearGradient(PL.x, 0, PL.x + PL.w, 0); pg.addColorStop(0, C.lime); pg.addColorStop(1, C.yellow);
  rr(PL.x + 36, PL.y + PL.h - 22, Math.max(7, (PL.w - 72) * p), 7, 3.5); ctx.fillStyle = pg; ctx.fill();
  const li = lineIdx(t);
  if (li >= 0 && t < SRC + .1) {
    const [st0, en, yo] = LINES[li], st = st0 - .06, lt = t - st, dur = en - st;
    const words = yo.split(' ');
    let size = 64; ctx.font = `900 ${size}px ${SANS}`; let rows = wrap(words, 920);
    while (rows.length > 2 && size > 44) { size -= 4; ctx.font = `900 ${size}px ${SANS}`; rows = wrap(words, 920); }
    const tot = words.reduce((s, w) => s + w.length + 2, 0); let acc = 0;
    const wt = words.map(w => { const s = acc; acc += (w.length + 2) / tot * dur * .9; return [s, acc]; });
    const lineH = size * 1.13, top = PL.y + 80 - (rows.length - 1) * lineH / 2, pop = back(lt / .25);
    const sp = ctx.measureText(' ').width; let wi = 0;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    rows.forEach((row, r) => {
      const tw = row.reduce((s, w) => s + ctx.measureText(w).width, 0) + sp * (row.length - 1);
      let x = 540 - tw / 2; const y = top + r * lineH;
      for (const w of row) {
        const ww = ctx.measureText(w).width, [ws, we] = wt[wi];
        const spoken = lt >= ws, active = lt >= ws && lt < we + .05;
        ctx.save(); const s = (.88 + .12 * pop) * (active ? 1 + .07 * (1 - easeOut((lt - ws) / .3)) : 1);
        ctx.translate(x + ww / 2, y); ctx.scale(s, s); ctx.translate(-ww / 2, 0);
        ctx.fillStyle = spoken ? (active ? C.yellow : '#ffffff') : 'rgba(255,255,255,.5)';
        if (active) { ctx.shadowColor = 'rgba(242,194,48,.6)'; ctx.shadowBlur = 20; }
        ctx.fillText(w, 0, 0); ctx.restore();
        x += ww + sp; wi++;
      }
    });
  }
  ctx.restore();
}

// ---------- ÀṢẸ stamp on every "Àṣẹ" ----------
function aseStamp(t) {
  for (const t0 of ASE) {
    const lt = t - t0; if (lt < 0 || lt > 1.5) continue;
    const inn = back(lt / .32), out = clamp((1.5 - lt) / .35);
    ctx.save(); ctx.globalAlpha = out;
    // light bloom
    const g = ctx.createRadialGradient(540, 860, 10, 540, 860, 520);
    g.addColorStop(0, `rgba(255,236,170,${.45 * (1 - lt / 1.5)})`); g.addColorStop(1, 'rgba(255,236,170,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 300, W, 1150);
    // rings
    for (let k = 0; k < 3; k++) { const rr2 = 120 + easeOut((lt - k * .08) / .9) * 360; ctx.globalAlpha = out * clamp(1 - (lt - k * .08) / 1.1) * .8;
      ctx.lineWidth = 6 - k * 1.5; ctx.strokeStyle = k % 2 ? '#fff' : C.yellow; ctx.beginPath(); ctx.arc(540, 860, rr2, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = out;
    // beads burst
    for (let k = 0; k < 18; k++) { const a = k * Math.PI * 2 / 18 + .2, d = 150 + easeOut(lt / .7) * 260;
      ctx.beginPath(); ctx.arc(540 + Math.cos(a) * d, 860 + Math.sin(a) * d * .85, 10 * (1 - lt / 1.5) + 2, 0, 7); ctx.fillStyle = k % 2 ? C.leaf : C.yellow; ctx.fill(); }
    ctx.translate(540, 860); ctx.rotate(-.07); ctx.scale(inn, inn);
    ctx.font = `900 190px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = 22; ctx.strokeStyle = C.deep; ctx.strokeText('ÀṢẸ', 0, 0);
    const tg = ctx.createLinearGradient(0, -90, 0, 90); tg.addColorStop(0, '#fff3c4'); tg.addColorStop(.5, C.yellow); tg.addColorStop(1, '#d9961a');
    ctx.fillStyle = tg; ctx.fillText('ÀṢẸ', 0, 0);
    ctx.restore();
  }
}

// ---------- hook ----------
function hook(t) {
  if (t > 4.2) return;
  const a = easeOut(t / .35) * clamp((4.2 - t) / .4);
  ctx.save(); ctx.globalAlpha = a;
  ctx.translate(800, 1170); ctx.rotate(.05 + Math.sin(t * 6) * .025); const s = .8 + .2 * back(t / .5); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  rr(-130, -60, 260, 120, 30); ctx.fillStyle = C.yellow; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 40px ${SANS}`; ctx.fillStyle = C.deep; ctx.fillText('🔊 SOUND ON', 0, 2);
  ctx.restore();
  const b = clamp((t - .15) / .35) * clamp((3.4 - t) / .4);
  if (b > 0) {
    ctx.save(); ctx.globalAlpha = b; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const s = .85 + .15 * back((t - .15) / .45); ctx.translate(540, 1010); ctx.scale(s, s); ctx.rotate(-.025);
    ctx.font = `900 70px ${SANS}`; ctx.lineWidth = 14; ctx.strokeStyle = C.deep;
    ctx.strokeText('She knows the old words', 0, -46); ctx.fillStyle = '#fff'; ctx.fillText('She knows the old words', 0, -46);
    ctx.font = `900 84px ${SANS}`; ctx.strokeText('by heart 🔥', 0, 46); ctx.fillStyle = C.yellow; ctx.fillText('by heart 🔥', 0, 46);
    ctx.restore();
  }
}

// ---------- outro ----------
function outro(t) {
  const lt = t - SRC; if (lt < 0) return;
  const a = easeOut(lt / .5);
  const og = ctx.createLinearGradient(0, 0, 0, H); og.addColorStop(0, '#ffffff'); og.addColorStop(1, '#f3ecdb');
  ctx.save(); ctx.globalAlpha = a * .95; ctx.fillStyle = og; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (LOGO) { const s = 300 * (.85 + .15 * back(lt / .6)), h = s * LOGO.height / LOGO.width; ctx.drawImage(LOGO, 540 - s / 2, 560 - h / 2, s, h); }
  const b = back((lt - .35) / .5); ctx.translate(540, 900); ctx.scale(b, b);
  ctx.font = `800 50px ${SANS}`; ctx.fillStyle = C.green; ctx.fillText('Comment', 0, -110);
  ctx.font = `900 200px ${SANS}`; const g = ctx.createLinearGradient(0, -80, 0, 80); g.addColorStop(0, C.green); g.addColorStop(1, '#c79a12');
  ctx.fillStyle = g; ctx.fillText('ÀṢẸ', 0, 30);
  ctx.font = `700 44px ${SANS}`; ctx.fillStyle = '#4c5a42'; ctx.fillText('if this moved you 🙏🏾', 0, 170);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = easeOut((lt - .9) / .5); ctx.textAlign = 'center';
  ctx.font = `600 38px ${SANS}`; ctx.fillStyle = C.green; ctx.fillText('Share it — keep the tradition alive', 540, 1260);
  let i = 0; for (let x = 250; x <= 830; x += 18, i++) { ctx.beginPath(); ctx.arc(x, 1330, 8, 0, 7); ctx.fillStyle = (Math.floor(i / 3) % 2) ? C.yellow : C.leaf; ctx.fill(); }
  ctx.restore();
}

window.drawFrame = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.shadowColor = 'transparent';
  base(t);
  header(t);
  deityCard(t);
  hook(t);
  aseStamp(t);
  captions(t);
  outro(t);
};
window.setFrame = (url) => new Promise(r => { const im = new Image(); im.onload = () => { FRAME = im; r(); }; im.src = url; });
window.init = async (edit, logoURL) => {
  E = edit; SRC = edit.src_dur; TOT = SRC + edit.outro; LINES = edit.lines;
  ASE = LINES.filter(l => l[2].startsWith('Àṣẹ')).map(l => l[0]);
  await document.fonts.load(`900 80px "Inter Display"`); await document.fonts.load(`700 40px "Inter Display"`); await document.fonts.load(`40px "Noto Color Emoji"`);
  LOGO = await new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = logoURL; });
  return TOT;
};
</script></body></html>
